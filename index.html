<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Endless Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0d13;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #game { display:block; width:100%; height:100%; touch-action:none; }

  #hud {
    position:fixed; top:0; left:0; right:0; padding:18px 22px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.7);
  }
  #score { font-size:44px; font-weight:800; letter-spacing:1px; line-height:1; }
  #score small { display:block; font-size:12px; font-weight:600; opacity:.6;
    letter-spacing:3px; margin-top:4px; }
  #best { font-size:15px; font-weight:700; opacity:.75; text-align:right; }
  #best span { display:block; font-size:26px; opacity:1; }

  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(circle at 50% 40%, rgba(20,30,70,.82), rgba(5,7,14,.96));
    backdrop-filter: blur(6px); color:#fff; text-align:center; padding:24px;
    transition:opacity .25s; z-index:10;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 { font-size:clamp(26px,6vw,44px); font-weight:900; letter-spacing:2px;
    background:linear-gradient(180deg,#fff,#8fa8ff); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #overlay p { font-size:15px; line-height:1.7; opacity:.8; max-width:430px; }
  #overlay kbd {
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    border-radius:6px; padding:1px 7px; font-family:inherit; font-size:13px; font-weight:700;
  }
  #finalScore { font-size:16px; opacity:.85; font-weight:700; }
  #finalScore b { font-size:34px; display:block; color:#ffc93c; }
  #startBtn {
    margin-top:8px; padding:15px 48px; font-size:17px; font-weight:800; letter-spacing:2px;
    border:none; border-radius:100px; cursor:pointer; color:#0b0d13;
    background:linear-gradient(180deg,#8fe3ff,#4a9dff);
    box-shadow:0 10px 30px rgba(74,157,255,.45), inset 0 -3px 0 rgba(0,0,0,.18);
    transition:transform .12s;
  }
  #startBtn:active { transform:scale(.95); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="score">0<small>PUNKTE</small></div>
  <div id="best">BEST<span id="bestVal">0</span></div>
</div>

<div id="overlay">
  <h1>ENDLESS RUNNER</h1>
  <p>
    <kbd>←</kbd> <kbd>→</kbd> Spur wechseln &nbsp;·&nbsp; <kbd>↑</kbd> / <kbd>Leertaste</kbd> springen<br>
    <kbd>↓</kbd> ducken &nbsp;·&nbsp; auf dem Handy: wischen
  </p>
  <div id="finalScore" style="display:none">SCORE<b id="finalVal">0</b></div>
  <button id="startBtn">START</button>
</div>

<script>
(() => {
"use strict";

/* =========================================================
   GRUND-SETUP
   ========================================================= */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let horizonY = 0;      // y-Position des Horizonts
let F = 600;           // Brennweite (Perspektive)

const CAM_Z = -7;      // Kamera-Z
const CAM_Y = 2.4;     // Kamera-Höhe
let camX = 0;          // Kamera-X (folgt dem Spieler leicht)

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  horizonY = H * 0.34;
  // Brennweite: passt Höhe UND Breite an (wichtig für Handys)
  F = Math.min(H * 0.95, W * 1.25);
}
window.addEventListener('resize', resize);

/* =========================================================
   PROJEKTION (fake 3D)
   ========================================================= */
function proj(x, y, z) {
  const depth = z - CAM_Z;
  const s = F / depth;
  return {
    x: W / 2 + (x - camX) * s,
    y: horizonY + (CAM_Y - y) * s,
    s: s
  };
}

function fillPoly(pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fill();
}

/* =========================================================
   SPIEL-KONSTANTEN
   ========================================================= */
const LANES       = [-1.7, 0, 1.7];   // X-Position der 3 Spuren
const START_SPEED = 22;
const MAX_SPEED   = 58;
const GRAVITY     = 30;
const JUMP_V      = 9.2;
const SLIDE_TIME  = 0.62;
const SPAWN_Z     = 140;              // hier erscheinen Hindernisse

// Hindernis-Typen
const TYPES = {
  low: {   // muss man SPRINGEN
    y0: 0, h: 0.78, w: 1.55, depth: 0.8,
    colors: { front:'#ff5a3c', top:'#ff8f78', side:'#bd3720' }
  },
  high: {  // muss man DUCKEN
    y0: 1.15, h: 1.5, w: 1.55, depth: 0.8,
    colors: { front:'#ffc93c', top:'#ffe38a', side:'#c3961f' }
  },
  block: { // muss man AUSWEICHEN
    y0: 0, h: 2.1, w: 1.55, depth: 1.4,
    colors: { front:'#4a7dff', top:'#8aabff', side:'#2c53b8' }
  }
};

/* =========================================================
   SPIEL-ZUSTAND
   ========================================================= */
let gameState = 'menu';   // 'menu' | 'playing' | 'over'

const player = {
  lane: 1, x: 0,
  y: 0, vy: 0, jumping: false,
  sliding: false, slideT: 0
};

let obstacles = [];
let speed = START_SPEED;
let distance = 0;
let score = 0;
let scrollDist = 0;
let spawnT = 0;
let bestScore = +(localStorage.getItem('runner_best') || 0);

/* =========================================================
   RESET / START / GAME OVER
   ========================================================= */
const $score    = document.getElementById('score');
const $bestVal  = document.getElementById('bestVal');
const $overlay  = document.getElementById('overlay');
const $startBtn = document.getElementById('startBtn');
const $finalBox = document.getElementById('finalScore');
const $finalVal = document.getElementById('finalVal');

$bestVal.textContent = bestScore;

function resetGame() {
  obstacles = [];
  speed = START_SPEED;
  distance = 0;
  score = 0;
  scrollDist = 0;
  spawnT = 0.9;
  camX = 0;

  player.lane = 1;
  player.x = 0;
  player.y = 0;
  player.vy = 0;
  player.jumping = false;
  player.sliding = false;
  player.slideT = 0;

  $score.textContent = 0;
}

function startGame() {
  resetGame();
  gameState = 'playing';
  $overlay.classList.add('hidden');
}

function gameOver() {
  gameState = 'over';
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('runner_best', bestScore);
    $bestVal.textContent = bestScore;
  }
  $finalVal.textContent = score;
  $finalBox.style.display = 'block';
  $startBtn.textContent = 'NOCHMAL';
  $overlay.classList.remove('hidden');
}

/* =========================================================
   STEUERUNG
   ========================================================= */
function moveLeft()  { if (player.lane > 0) player.lane--; }
function moveRight() { if (player.lane < 2) player.lane++; }

function doJump() {
  if (player.jumping || player.sliding) return;
  player.jumping = true;
  player.vy = JUMP_V;
}

function doSlide() {
  if (player.sliding || player.jumping) return;
  player.sliding = true;
  player.slideT = SLIDE_TIME;
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();

  if (gameState !== 'playing') {
    if (k === ' ' || k === 'enter') { e.preventDefault(); startGame(); }
    return;
  }

  if (k === 'arrowleft'  || k === 'a') { e.preventDefault(); moveLeft(); }
  else if (k === 'arrowright' || k === 'd') { e.preventDefault(); moveRight(); }
  else if (k === 'arrowup'    || k === 'w' || k === ' ') { e.preventDefault(); doJump(); }
  else if (k === 'arrowdown'  || k === 's') { e.preventDefault(); doSlide(); }
});

// Touch / Swipe
let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = {
    x: e.touches[0].clientX,
    y: e.touches[0].clientY
  };
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  const adx = Math.abs(dx), ady = Math.abs(dy);

  if (Math.max(adx, ady) < 26) {
    if (gameState !== 'playing') startGame();
  } else if (gameState === 'playing') {
    if (adx > ady) { dx > 0 ? moveRight() : moveLeft(); }
    else           { dy > 0 ? doSlide()  : doJump();   }
  }
  touchStart = null;
}, { passive: true });

$startBtn.addEventListener('click', startGame);

/* =========================================================
   HINDERNISSE
   ========================================================= */
function pickType() {
  const r = Math.random();
  if (r < 0.34) return 'low';
  if (r < 0.68) return 'high';
  return 'block';
}

function spawnObstacle() {
  const progress = Math.min(1, distance / 900);
  let lanes;

  if (distance < 150 || Math.random() < 0.62) {
    // eine Spur
    lanes = [Math.floor(Math.random() * 3)];
  } else {
    // zwei Spuren – eine bleibt frei
    const free = Math.floor(Math.random() * 3);
    lanes = [0, 1, 2].filter(l => l !== free);
  }

  for (const ln of lanes) {
    const type = pickType();
    const def = TYPES[type];
    obstacles.push({
      x: LANES[ln],
      z: SPAWN_Z,
      y0: def.y0, h: def.h, w: def.w, depth: def.depth,
      colors: def.colors,
      passed: false
    });
  }

  const base = 1.25 - 0.45 * progress;      // wird mit der Zeit enger
  spawnT = (lanes.length > 1 ? base * 1.55 : base) + Math.random() * 0.3;
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
  /* --- Geschwindigkeit & Score --- */
  distance += speed * dt;
  scrollDist += speed * dt;
  score = Math.floor(distance);
  speed = Math.min(MAX_SPEED, START_SPEED + distance * 0.02);

  $score.firstChild.nodeValue = score;

  /* --- Spieler horizontal --- */
  const targetX = LANES[player.lane];
  player.x += (targetX - player.x) * Math.min(1, dt * 16);

  /* --- Sprung --- */
  if (player.jumping) {
    player.vy -= GRAVITY * dt;
    player.y  += player.vy * dt;
    if (player.y <= 0) { player.y = 0; player.vy = 0; player.jumping = false; }
  }

  /* --- Ducken --- */
  if (player.sliding) {
    player.slideT -= dt;
    if (player.slideT <= 0) player.sliding = false;
  }

  /* --- Hindernisse bewegen --- */
  for (const o of obstacles) o.z -= speed * dt;

  /* --- Kollision --- */
  for (const o of obstacles) {
    if (!o.passed && o.z <= 0.4) {
      o.passed = true;
      if (checkHit(o)) { gameOver(); return; }
    }
  }

  /* --- Aufräumen --- */
  obstacles = obstacles.filter(o => o.z > -6);

  /* --- Nachschub --- */
  spawnT -= dt;
  if (spawnT <= 0) spawnObstacle();

  /* --- Kamera --- */
  camX = player.x * 0.3;
}

function checkHit(o) {
  // Seitlicher Abstand
  if (Math.abs(player.x - o.x) > 0.95) return false;

  // Höhen-Überlappung (AABB)
  const pBot = player.y;
  const pTop = player.y + (player.sliding ? 0.85 : 1.88);
  const oBot = o.y0;
  const oTop = o.y0 + o.h;

  return pBot < oTop && pTop > oBot;
}

/* =========================================================
   RENDERING
   ========================================================= */
function drawGround() {
  // Himmel
  const sky = ctx.createLinearGradient(0, 0, 0, horizonY + 60);
  sky.addColorStop(0,    '#0b1230');
  sky.addColorStop(0.55, '#22306b');
  sky.addColorStop(1,    '#5b6ea8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizonY + 2);

  // Boden
  const gr = ctx.createLinearGradient(0, horizonY, 0, H);
  gr.addColorStop(0, '#20242f');
  gr.addColorStop(1, '#0a0c12');
  ctx.fillStyle = gr;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // Horizont-Glow
  const glow = ctx.createLinearGradient(0, horizonY - 70, 0, horizonY + 8);
  glow.addColorStop(0, 'rgba(120,160,255,0)');
  glow.addColorStop(1, 'rgba(120,160,255,0.28)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, horizonY - 70, W, 80);

  // Außenkanten (durchgezogen)
  for (const lx of [-2.62, 2.62]) {
    fillPoly([
      proj(lx - 0.07, 0, -5), proj(lx + 0.07, 0, -5),
      proj(lx + 0.07, 0, 140), proj(lx - 0.07, 0, 140)
    ], 'rgba(140,170,255,0.30)');
  }

  // Gestrichelte Spurlinien
  const period = 7, dashLen = 3.2;
  let z0 = -(scrollDist % period);
  while (z0 < 130) {
    const za = Math.max(z0, -5);
    const zb = Math.min(z0 + dashLen, 130);
    if (zb > za + 0.01) {
      for (const lx of [-0.85, 0.85]) {
        fillPoly([
          proj(lx - 0.045, 0, za), proj(lx + 0.045, 0, za),
          proj(lx + 0.045, 0, zb), proj(lx - 0.045, 0, zb)
        ], 'rgba(200,215,255,0.42)');
      }
    }
    z0 += period;
  }
}

function drawBox(cx, z, w, h, y0, depth, colors) {
  const nz = z - depth / 2;
  const fz = z + depth / 2;
  if (nz - CAM_Z < 1.5) return;          // zu nah an der Kamera

  const x1 = cx - w / 2, x2 = cx + w / 2;
  const y1 = y0,         y2 = y0 + h;

  const p = [
    proj(x1, y2, nz), proj(x2, y2, nz),  // 0,1  nah oben
    proj(x2, y1, nz), proj(x1, y1, nz),  // 2,3  nah unten
    proj(x1, y2, fz), proj(x2, y2, fz),  // 4,5  fern oben
    proj(x2, y1, fz), proj(x1, y1, fz)   // 6,7  fern unten
  ];

  if (CAM_Y > y2) fillPoly([p[0], p[1], p[5], p[4]], colors.top);   // Deckel
  if (camX < x1)  fillPoly([p[0], p[4], p[7], p[3]], colors.side);  // links
  if (camX > x2)  fillPoly([p[1], p[5], p[6], p[2]], colors.side);  // rechts
  fillPoly([p[0], p[1], p[2], p[3]], colors.front);                 // Front
}

function drawObstacle(o) {
  drawBox(o.x, o.z, o.w, o.h, o.y0, o.depth, o.colors);
}

/* --------- Der Charakter mit Hut --------- */
function drawGuy(u) {
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * u, -(y + h) * u, w * u, h * u);
  }
  function circle(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx * u, -cy * u, r * u, 0, Math.PI * 2);
    ctx.fill();
  }

  // Beine
  rect(-0.20, 0.10, 0.16, 0.54, '#2b2f45');
  rect( 0.04, 0.10, 0.16, 0.54, '#2b2f45');
  // Schuhe
  rect(-0.24, 0.00, 0.22, 0.13, '#e9ecf5');
  rect( 0.02, 0.00, 0.22, 0.13, '#e9ecf5');
  // Körper / Jacke
  rect(-0.28, 0.58, 0.56, 0.74, '#ff6b35');
  rect(-0.28, 0.58, 0.56, 0.10, '#ff8f5e');
  // Arme
  rect(-0.39, 0.70, 0.12, 0.48, '#ff6b35');
  rect( 0.27, 0.70, 0.12, 0.48, '#ff6b35');
  // Hände
  rect(-0.39, 0.60, 0.12, 0.12, '#f2c49b');
  rect( 0.27, 0.60, 0.12, 0.12, '#f2c49b');
  // Hals
  rect(-0.07, 1.28, 0.14, 0.12, '#f2c49b');
  // Kopf
  circle(0, 1.53, 0.205, '#f2c49b');
  // Augen
  circle(-0.075, 1.57, 0.032, '#171a22');
  circle( 0.075, 1.57, 0.032, '#171a22');
  // === HUT ===
  rect(-0.27, 1.68, 0.54, 0.065, '#e63946');   // Krempe
  rect(-0.21, 1.745, 0.42, 0.17, '#e63946');   // Krone
  rect(-0.21, 1.745, 0.42, 0.045, '#ff6270');  // Glanzstreifen
  rect(-0.21, 1.83,  0.42, 0.03, '#a8232e');   // Schatten
}

function drawPlayer() {
  const s = F / (0 - CAM_Z);                       // Maßstab auf Spieler-Tiefe
  const groundScreenY = horizonY + CAM_Y * s;
  const px = W / 2 + (player.x - camX) * s;
  const feetY = groundScreenY - player.y * s;

  // Schatten
  const sh = Math.max(0.35, 1 - player.y * 0.28);
  ctx.save();
  ctx.globalAlpha = 0.32 * sh;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(px, groundScreenY, 0.42 * s * sh, 0.15 * s * sh, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(px, feetY);

  if (player.sliding) {
    // geduckt = gestaucht + leicht nach vorne gelehnt
    ctx.scale(1.22, 0.48);
    ctx.translate(0.12 * s, 0);
  }

  drawGuy(s);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawGround();

  // nach Tiefe sortiert zeichnen
  const sorted = obstacles.slice().sort((a, b) => b.z - a.z);

  for (const o of sorted) if (o.z > 0) drawObstacle(o);   // hinter dem Spieler
  drawPlayer();
  for (const o of sorted) if (o.z <= 0) drawObstacle(o);  // vor dem Spieler
}

/* =========================================================
   GAME LOOP
   ========================================================= */
let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;   // Stabilität nach Tab-Wechsel

  if (gameState === 'playing') update(dt);

  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   LOS GEHT'S
   ========================================================= */
resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
